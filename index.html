<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open My Letter ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Decorations -->
    <div class="background-hearts">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Main Container -->
    <main class="container">

        <!-- Title -->
        <h1 class="title">
            You've Received a Letter 💌
        </h1>

        <p class="subtitle">
            Tap the envelope to open it
        </p>

        <!-- Envelope -->
        <div class="envelope-wrapper">

            <div class="envelope" id="envelope">

                <!-- Back -->
                <div class="envelope-back"></div>

                <!-- Letter -->
                <div class="letter">

                    <div class="paper">

                        <div class="paper-top"></div>

                        <div class="paper-content">

                            <h2>For You ❤️</h2>

                            <p>
                                A special letter is waiting for you...
                            </p>

                        </div>

                    </div>

                </div>

                <!-- Flap -->
                <div class="flap"></div>

                <!-- Front -->
                <div class="front">

                    <!-- Ribbon -->
                    <div class="bow">
                        <div class="left-loop"></div>
                        <div class="center-knot"></div>
                        <div class="right-loop"></div>
                    </div>

                    <!-- Decorative Wave -->
                    <div class="wave"></div>

                </div>

            </div>

        </div>

        <p class="click-text">
            ❤️ Click Anywhere on the Envelope ❤️
        </p>

    </main>

    <!-- Floating Hearts (Generated by JS later) -->
    <div id="hearts-container"></div>

    <!-- Audio (Optional) -->
    <!--
    <audio id="bgMusic" loop>
        <source src="music/love.mp3" type="audio/mp3">
    </audio>
    -->

    <!-- Javascript -->
    <script src="script.js"></script>

</body>
</html>
